<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050607">
    <meta name="description" content="theDAW boot sequence: the particle face becomes the wordmark, then the GANTASMO credit.">
    <link rel="icon" href="data:,">
    <title>theDAW — The Architect</title>
    <style>:root {
  font-family: "Segoe UI", Arial, sans-serif;
  color: #dce1e5;
  background: #050607;
  font-synthesis: none;
  color-scheme: dark;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
button:focus-visible { outline: 2px solid #f36676; outline-offset: 8px; }
[hidden] { display: none !important; }

.loader { position: relative; width: 100%; height: 100svh; min-height: 420px; overflow: hidden; isolation: isolate; }
.scene, .atmosphere { position: absolute; inset: 0; pointer-events: none; }
.scene canvas { display: block; width: 100%; height: 100%; }
.atmosphere { background: radial-gradient(ellipse at 50% 44%, transparent 24%, var(--loader-bg, #050607) 100%); opacity: var(--vignette, .7); }
.arrival { font-family: "SFMono-Regular", Consolas, monospace; font-weight: 400; }
.identity { position: absolute; top: var(--caption-y, 77%); left: 0; width: 100%; text-align: center; opacity: var(--identity-opacity, 0); transform: translateY(calc((1 - var(--identity-opacity, 0)) * 8px)); pointer-events: none; }
.identity h1 { margin: 11px 0 0; padding-left: var(--caption-tracking, 7px); font-size: var(--caption-size, 14px); font-weight: 450; letter-spacing: var(--caption-tracking, 7px); color: #d7e4eb; }
.arrival { position: absolute; top: var(--tagline-y, 62%); width: 100%; text-align: center; font-size: var(--tagline-size, 9px); letter-spacing: 4px; color: #a0afb9; opacity: var(--arrival-opacity, 0); pointer-events: none; }
.sequence-footer { position: absolute; bottom: 45px; left: 50%; width: min(280px, calc(100% - 48px)); transform: translateX(-50%); opacity: var(--exit-opacity, 1); }
.status-row { display: flex; align-items: center; min-height: 25px; gap: 9px; margin-bottom: 13px; }
.status-light { width: 4px; height: 4px; background: var(--loader-accent, #fa435c); border-radius: 50%; box-shadow: 0 0 9px #ff365f66; }
#status { margin: 0; font-size: 11px; letter-spacing: .2px; color: #a0a5ad; }
#replay { margin-left: auto; border: 0; padding: 4px 0 4px 10px; background: transparent; color: #a0a5ad; font-size: 10px; cursor: pointer; transition: color .2s; }
#replay span { display: inline-block; margin-right: 4px; font-size: 15px; vertical-align: -1px; }
#replay:hover { color: #fff; }
#replay:disabled, [data-embed="true"] #replay { display: none; }
.progress { height: 1px; background: #ffffff16; }
.progress > div { height: 100%; width: 100%; background: var(--loader-accent, #ff697d); transform: scaleX(0); transform-origin: left; box-shadow: 0 0 8px #ff45664d; }
.fallback, .noscript-brand { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.fallback-word, .noscript-brand { font-size: clamp(64px, 16vw, 160px); font-weight: 350; letter-spacing: -.065em; }
.fallback-word strong { font-weight: 850; }
.fallback p, .noscript-brand p { color: #a0a5ad; letter-spacing: .1em; font-size: 12px; }

@media (max-width: 760px) {
  .arrival { letter-spacing: 2.2px; }
  .sequence-footer { bottom: 34px; }
}

@media (max-height: 560px) and (min-width: 761px) {
  .sequence-footer { bottom: 22px; }
}


/* The credit stack theDAW has always shown under its wordmark: "by" in
   Orbitron chrome and the animated GANTASMO logo. It takes its opacity from
   the loader's own --arrival-opacity, which the runtime raises the moment the
   word has finished forming (morphEnd) and lowers again with the fade-out and
   the exit spin, so the credits arrive and leave with the word itself. The
   logo trails "by" by a third of that ramp. */
@font-face { font-family: "Orbitron"; src: url("/Orbitron.ttf") format("truetype"); font-display: swap; }
.credits { position: absolute; top: var(--credits-y, 68%); left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; opacity: var(--arrival-opacity, 0); transform: translateY(calc((1 - var(--arrival-opacity, 0)) * 10px)); }
.credits .by { font-family: "Orbitron", system-ui, sans-serif; font-weight: 700; letter-spacing: .18em; font-size: clamp(11px, 2.2vh, 24px); background-image: linear-gradient(180deg, #ffffff 0%, #cbb9e8 46%, #7a6aa0 56%, #efe9fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 1px 0 rgba(255,255,255,.18), 0 3px 6px rgba(0,0,0,.6); }
.credits .logo { height: clamp(34px, 8vh, 110px); max-width: 70vw; object-fit: contain; opacity: clamp(0, calc((var(--arrival-opacity, 0) - .35) / .65), 1); transform: translateY(calc(clamp(0, 1 - (var(--arrival-opacity, 0) - .35) / .65, 1) * 8px)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
