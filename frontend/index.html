<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v=3 busts browser cache after the favicon mark changes —
         browsers cache favicons aggressively (across reloads, even
         across sessions) so the version query is the cleanest
         "please refetch" signal. Bump when /favicon.svg changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <!-- The boot sequence page and the credit logo it shows start downloading
         before the JS bundle, so the sequence starts the moment React mounts
         its host. -->
    <link rel="prefetch" href="/splash/index.html" />
    <link rel="preload" as="image" href="/GANTASMO_LOGO.webp" />
    <title>theDAW · by GANTASMO</title>
    <!-- Instant boot cover: the same near-black the boot sequence opens on,
         painted on the FIRST byte, before the JS bundle. React mounts the
         boot sequence (ParticleSplash, public/splash/index.html) on top of it
         and main.tsx removes this node, so the sequence's own fade-in is the
         first thing that moves. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #050607;
      }
    </style>
  </head>
  <body style="margin: 0; background: #050607">
    <div id="boot-splash"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
