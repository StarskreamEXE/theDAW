<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v=3 busts browser cache after the favicon mark changes —
         browsers cache favicons aggressively (across reloads, even
         across sessions) so the version query is the cleanest
         "please refetch" signal. Bump when /favicon.svg changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <!-- The boot sequence is an iframe in THIS document, not something React
         mounts, so the browser starts fetching and running it on the first
         byte, in parallel with the app bundle. It used to be mounted by
         ParticleSplash, which meant it could not start until the whole module
         graph had downloaded and React had committed: measured at 1.4 s here
         and about 5 s on a cold dev server, all of it a black screen. -->
    <title>theDAW · by GANTASMO</title>
    <!-- The boot layer: the sequence itself, on the near-black it opens on.
         App.tsx fades and removes this node once the backend is ready and the
         sequence has reported complete; ParticleSplash draws the setup status
         and the escape hatch over it. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #050607;
      }
      #boot-splash iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #050607;
      }
    </style>
  </head>
  <body style="margin: 0; background: #050607">
    <div id="boot-splash">
      <iframe
        id="boot-splash-frame"
        src="/splash/index.html"
        title="theDAW boot sequence"
        scrolling="no"
      ></iframe>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
